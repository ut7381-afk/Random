<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Forgive Me?</title>

  <!-- Google Fonts for Cute Typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
      font-family: 'Poppins', sans-serif;
    }

    /* Card Container */
    .card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: clamp(25px, 6vw, 40px) clamp(20px, 5vw, 30px);
      border-radius: 25px;
      box-shadow: 0 15px 35px rgba(255, 154, 158, 0.35);
      text-align: center;
      max-width: 420px;
      width: 88%;
      z-index: 10;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    /* Cursive Headings */
    h1 {
      font-family: 'Pacifico', cursive;
      font-size: clamp(1.4rem, 5vw, 1.8rem);
      color: #ff4757;
      margin-bottom: 20px;
      line-height: 1.4;
      font-weight: 400;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
    }

    /* Included GIF Styling */
    .gif-container {
      margin: 10px auto 20px auto;
      max-width: 180px;
      width: 100%;
    }

    .gif-container img {
      width: 100%;
      height: auto;
      border-radius: 15px;
      display: block;
      margin: 0 auto;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      min-height: 60px;
      position: relative;
    }

    button {
      padding: 12px 28px;
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1rem, 4vw, 1.1rem);
      font-weight: 600;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      touch-action: manipulation;
      transition: transform 0.2s ease, background-color 0.2s ease;
    }

    button:active {
      transform: scale(0.95);
    }

    .btn-yes {
      background-color: #2ed573;
      color: white;
      box-shadow: 0 6px 18px rgba(46, 213, 115, 0.35);
    }

    .btn-no {
      background-color: #ff4757;
      color: white;
      box-shadow: 0 6px 18px rgba(255, 71, 87, 0.35);
      position: relative;
      z-index: 20;
    }

    .btn-next {
      background-color: #ff6b81;
      color: white;
      margin-top: 15px;
      box-shadow: 0 6px 18px rgba(255, 107, 129, 0.35);
    }

    /* Helper Class */
    .hidden {
      display: none !important;
    }

    /* Floating Background Elements */
    #float-container {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 1;
    }

    .balloon {
      position: absolute;
      bottom: -100px;
      width: 50px;
      height: 65px;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      animation: floatUp 6s ease-in-out infinite;
      opacity: 0.8;
    }

    .balloon::after {
      content: "";
      position: absolute;
      bottom: -12px;
      left: 24px;
      width: 2px;
      height: 15px;
      background: rgba(0,0,0,0.15);
    }

    .heart-balloon {
      position: absolute;
      bottom: -60px;
      width: 38px;
      height: 38px;
      background-color: #ff3366;
      transform: rotate(-45deg);
      animation: floatUp 5s ease-in-out infinite;
      opacity: 0.85;
    }

    .heart-balloon::before,
    .heart-balloon::after {
      content: "";
      width: 38px;
      height: 38px;
      background-color: #ff3366;
      border-radius: 50%;
      position: absolute;
    }

    .heart-balloon::before { top: -19px; left: 0; }
    .heart-balloon::after { left: 19px; top: 0; }

    .floating-emoji {
      position: absolute;
      bottom: -60px;
      font-size: 2.3rem;
      animation: floatUp 4s ease-in-out infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0.9;
      }
      100% {
        transform: translateY(-110vh) rotate(25deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Audio Elements -->
  <audio id="audio-stage4" src="my_trimmed_audio.mp3" preload="auto"></audio>
  <audio id="audio-stage5" src="mai_tera_boyfriend.mp3" preload="auto"></audio>

  <div id="float-container"></div>

  <!-- Stage 1 -->
  <div id="stage1" class="card">
    <h1>Will you forgive me please? 🥺</h1>
    <div class="btn-group">
      <button class="btn-yes" onclick="showForgiven()">Yes</button>
      <button class="btn-no" onclick="goToStage2()">No</button>
    </div>
  </div>

  <!-- Stage 2 -->
  <div id="stage2" class="card hidden">
    <h1>I am very sorry for what I did not do 😭</h1>
    <div class="btn-group">
      <button class="btn-yes" onclick="showForgiven()">Yes</button>
      <button id="runaway-no" class="btn-no">No</button>
    </div>
  </div>

  <!-- Stage 3 -->
  <div id="stage3" class="card hidden">
    <h1>I knew u would forgive me 🥰</h1>
    <button class="btn-next" onclick="goToStage4()">Next Slide</button>
  </div>

  <!-- Stage 4: Proposal -->
  <div id="stage4" class="card hidden">
    <h1>Will U give me the opportunity to make u my Girlfriend ❤️</h1>
    <div class="gif-container">
      <img src="ProposeInLoveGIFbyCosytales.gif" alt="Proposal GIF" />
    </div>
    <div class="btn-group">
      <button class="btn-yes" onclick="goToStage5()">Yes</button>
      <button id="proposal-no" class="btn-no">No</button>
    </div>
  </div>

  <!-- Stage 5: Final -->
  <div id="stage5" class="card hidden">
    <h1>The start of the relationship of Mr and Mrs Bhondu 👩‍❤️‍👨✨</h1>
  </div>

  <script>
    let stage2Attempts = 0;
    let stage4Attempts = 0;
    let currentInterval = null;

    function goToStage2() {
      document.getElementById('stage1').classList.add('hidden');
      document.getElementById('stage2').classList.remove('hidden');
      
      const noBtn = document.getElementById('runaway-no');
      resetButton(noBtn);
      stage2Attempts = 0;
      attachRunawayEvents(noBtn, () => stage2Attempts++, () => stage2Attempts);
    }

    function showForgiven() {
      document.getElementById('stage1').classList.add('hidden');
      document.getElementById('stage2').classList.add('hidden');
      document.getElementById('stage3').classList.remove('hidden');
      startBalloons();
    }

    function goToStage4() {
      clearInterval(currentInterval);
      document.getElementById('float-container').innerHTML = '';

      document.getElementById('stage3').classList.add('hidden');
      document.getElementById('stage4').classList.remove('hidden');

      const noBtn = document.getElementById('proposal-no');
      resetButton(noBtn);
      stage4Attempts = 0;
      attachRunawayEvents(noBtn, () => stage4Attempts++, () => stage4Attempts);

      const audio4 = document.getElementById('audio-stage4');
      if (audio4) audio4.play().catch(e => console.log("Audio playback:", e));

      startHeartBalloons();
    }

    function goToStage5() {
      clearInterval(currentInterval);
      document.getElementById('float-container').innerHTML = '';

      document.getElementById('stage4').classList.add('hidden');
      document.getElementById('stage5').classList.remove('hidden');

      const audio4 = document.getElementById('audio-stage4');
      const audio5 = document.getElementById('audio-stage5');
      if (audio4) audio4.pause();
      if (audio5) audio5.play().catch(e => console.log("Audio playback:", e));

      startHappyEmojis();
    }

    /* Core Evasive Button Logic */
    function resetButton(btn) {
      btn.style.position = 'relative';
      btn.style.left = 'auto';
      btn.style.top = 'auto';
      btn.style.display = 'inline-block';
    }

    function moveButtonSafely(btn) {
      btn.style.position = 'fixed';
      
      const btnRect = btn.getBoundingClientRect();
      const padding = 20;

      const maxX = window.innerWidth - btnRect.width - padding;
      const maxY = window.innerHeight - btnRect.height - padding;

      const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
      const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

      btn.style.left = randomX + 'px';
      btn.style.top = randomY + 'px';
    }

    function attachRunawayEvents(btn, incrementFn, getAttemptsFn) {
      const handleAction = () => {
        incrementFn();
        if (getAttemptsFn() >= 5) {
          btn.style.display = 'none';
          return;
        }
        moveButtonSafely(btn);
      };

      btn.onmouseover = handleAction;
      btn.onclick = handleAction;
      btn.ontouchstart = (e) => {
        handleAction();
      };
    }

    /* Floating Animations */
    function startBalloons() {
      const container = document.getElementById('float-container');
      const colors = ['#ff4757', '#ff6b81', '#7bed9f', '#70a1ff', '#eccc68', '#ff7f50'];

      currentInterval = setInterval(() => {
        const balloon = document.createElement('div');
        balloon.classList.add('balloon');

        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        const randomLeft = Math.random() * 90;
        const randomSize = Math.random() * 20 + 40;
        const randomDuration = Math.random() * 3 + 4;

        balloon.style.backgroundColor = randomColor;
        balloon.style.left = randomLeft + '%';
        balloon.style.width = randomSize + 'px';
        balloon.style.height = (randomSize * 1.3) + 'px';
        balloon.style.animationDuration = randomDuration + 's';

        container.appendChild(balloon);
        setTimeout(() => balloon.remove(), randomDuration * 1000);
      }, 300);
    }

    function startHeartBalloons() {
      const container = document.getElementById('float-container');
      const colors = ['#ff3366', '#ff4757', '#ff6b81', '#ff1493', '#db7093'];

      currentInterval = setInterval(() => {
        const heart = document.createElement('div');
        heart.classList.add('heart-balloon');

        const randomColor = colors[Math.floor(Math.random() * colors.length)];
        const randomLeft = Math.random() * 90;
        const randomDuration = Math.random() * 3 + 4;

        heart.style.backgroundColor = randomColor;
        heart.style.left = randomLeft + '%';
        heart.style.animationDuration = randomDuration + 's';

        container.appendChild(heart);
        setTimeout(() => heart.remove(), randomDuration * 1000);
      }, 350);
    }

    function startHappyEmojis() {
      const container = document.getElementById('float-container');
      const emojis = ['🥳', '🎉', '🎊', '❤️', '💖', '🥰', '✨', '💐', '💍', '🍾'];

      currentInterval = setInterval(() => {
        const emojiEl = document.createElement('div');
        emojiEl.classList.add('floating-emoji');
        
        emojiEl.innerText = emojis[Math.floor(Math.random() * emojis.length)];
        const randomLeft = Math.random() * 90;
        const randomDuration = Math.random() * 3 + 3;

        emojiEl.style.left = randomLeft + '%';
        emojiEl.style.animationDuration = randomDuration + 's';

        container.appendChild(emojiEl);
        setTimeout(() => emojiEl.remove(), randomDuration * 1000);
      }, 250);
    }
  </script>
</body>
</html>
